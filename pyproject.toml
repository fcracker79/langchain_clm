[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-clm"
version = "0.1.0"
description = "Route LangGraph graphs with a CLM (Contrastive Language Model): pick the next node by matching the state against route descriptions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "torch>=2.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
